name: Update grocery prices

on:
  schedule:
    # Twice a month (1st and 15th, 13:00 UTC) — BLS/FRED release schedules
    # vary by series, so this catches most updates within ~2 weeks of release.
    - cron: "0 13 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest prices from FRED
        run: python scripts/fetch_prices.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/prices.json; then
            echo "No changes to data/prices.json — nothing to commit."
          else
            git add data/prices.json
            git commit -m "Update grocery prices ($(date -u +%Y-%m-%d))"
            git push
          fi
